    <style>

        :root {
            --color-dep: #e57f25;
        }


        #loading-bg {

            width: 100%;
            height: 100%;

            background: #ffffff;

            display: block;

            position: fixed;

            z-index: 99999;

            pointer-events: none;

            top: 6px;
            left: 0;

        }


        .loading {

            position: absolute;

            left: calc(50% - 35px);

            top: 50%;

            width: 55px;
            height: 55px;

            border-radius: 50%;

            box-sizing: border-box;

            border: 3px solid transparent;

        }


        .loading .effect-1,
        .loading .effect-2,
        .loading .effect-3 {

            position: absolute;

            width: 100%;
            height: 100%;

            border: 3px solid transparent;

            border-left:
                3px solid
                var(--color-dep);

            border-radius: 50%;

            box-sizing: border-box;

        }


        .loading .effect-1 {

            animation:
                rotate
                1s
                ease
                infinite;

        }


        .loading .effect-2 {

            animation:
                rotateOpacity
                1s
                ease
                infinite
                .1s;

        }


        .loading .effect-3 {

            animation:
                rotateOpacity
                1s
                ease
                infinite
                .2s;

        }


        @keyframes rotate {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }


        @keyframes rotateOpacity {

            0% {

                transform: rotate(0deg);

                opacity: .1;

            }

            100% {

                transform: rotate(360deg);

                opacity: 1;

            }

        }

    </style>


    <!-- ===================================================== -->
    <!-- ESTILOS DEL RESULTADO FLASK                           -->
    <!-- ===================================================== -->

    <style>

        .resultado-flask {

            width: 100%;

            min-height: 60vh;

            padding:
                55px
                15px
                75px;

            background-color: #fafafa;

            font-family:
                "Montserrat",
                Helvetica,
                Arial,
                sans-serif;

        }


        .resultado-flask-card {

            width: 100%;

            max-width: 850px;

            margin: 0 auto;

            background-color: #ffffff;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, .12);

        }


        /* ================================================= */
        /* CABECERA                                          */
        /* ================================================= */


        .resultado-flask-titulo {

            padding:
                38px
                30px
                25px;

            text-align: center;

        }


        .resultado-flask-titulo h1 {

            margin: 0 0 9px;

            color: #57526b;

            font-size: 29px;

            line-height: 1.3;

            font-weight: 700;

        }


        .resultado-flask-titulo p {

            margin: 0;

            color: #e57f25;

            font-size: 16px;

            font-weight: 600;

        }


        .resultado-titulo-linea {

            width: 85px;
            height: 4px;

            margin:
                18px auto
                0;

            background-color: #e57f25;

            border-radius: 5px;

        }


        /* ================================================= */
        /* ESTADO DEL FOLIO                                  */
        /* ================================================= */


        .resultado-estado {

            margin:
                10px
                30px
                30px;

            padding:
                20px
                25px;

            border-radius: 8px;

            text-align: center;

            color: #ffffff;

            font-size: 20px;

            line-height: 1.4;

            font-weight: 700;

            letter-spacing: .4px;

            overflow-wrap: anywhere;

            box-shadow:

        }


        .resultado-estado.vigente {

            background-color: #28a745;

        }


        .resultado-estado.vencido {

            background-color: #b8860b;

        }


        .resultado-estado.no-registrado {

            background-color: #c62828;

        }


        /* ================================================= */
        /* DATOS                                             */
        /* ================================================= */


        .resultado-datos {

            margin:
                0
                30px
                30px;

            padding:
                10px
                25px;

            background-color: #f7f7f7;

            border:
                1px solid
                #dddddd;

            border-radius: 8px;

        }


        .resultado-dato {

            padding:
                17px
                5px;

            border-bottom:
                1px solid
                #e2e2e2;

        }


        .resultado-dato:last-child {

            border-bottom: none;

        }


        .resultado-dato strong {

            display: block;

            margin-bottom: 5px;

            color: #57526b;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .5px;

        }


        .resultado-dato span {

            display: block;

            color: #333333;

            font-size: 15px;

            line-height: 1.5;

            overflow-wrap: anywhere;

        }


        /* ================================================= */
        /* NO REGISTRADO                                     */
        /* ================================================= */


        .resultado-no-encontrado {

            margin:
                0
                30px
                35px;

            padding:
                35px
                25px;

            text-align: center;

            color: #57526b;

            background-color: #f7f7f7;

            border:
                1px solid

            border-radius: 8px;

        .resultado-no-encontrado p {

                8px
                0;

            font-size: 15px;

        }


        /* ================================================= */
        /* DOCUMENTO                                         */
        /* ================================================= */

            margin:

                20px

            text-align: center;

            color: #57526b;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: .4px;

        /* REGRESAR                                          */
        /* ================================================= */

            padding-bottom: 40px;

        .resultado-regresar {

        #angular-fallback {

                        {% else %}

                    {{ resultado.estado }}

                    'NO REGISTRADO'
                ] %}

                            Folio no registrado

                        </p>

<!-- ========================================================= -->
<!-- MONTAJE DEL RESULTADO                                    -->
<!-- ========================================================= -->


<script>

(function () {


    const template =
        document.getElementById(
            "resultado-flask-template"
        );


    if (!template) {

        return;

    }



    function crearResultado() {


        const wrapper =
            document.createElement("div");


        wrapper.setAttribute(
            "data-resultado-flask",
            "true"
        );


        wrapper.appendChild(
            template.content.cloneNode(true)
        );


        return wrapper;

    }



    function montarResultado() {


        const main =
            document.getElementById(
                "main-content"
            );


        if (!main) {

            return false;

        }


        /*
         * Si ya está montado y Angular no lo borró,
         * no hacemos nada.
         */

        if (
            main.querySelector(
                "[data-resultado-flask='true']"
            )
        ) {

            return true;

        }


        /*
         * Quitamos el contenido de la ruta Angular.
         * Queremos conservar navbar/footer,
         * pero el centro será nuestro resultado Flask.
         */

        const resultado =
            crearResultado();


        main.replaceChildren(
            resultado
        );


        return true;

    }



    /*
     * Primer intento inmediatamente.
     */

    montarResultado();



    /*
     * Angular puede reconstruir el DOM después.
     * Si elimina nuestro resultado,
     * MutationObserver lo vuelve a insertar.
     */

    const observer =
        new MutationObserver(
            function () {

                montarResultado();

            }
        );


    observer.observe(
        document.documentElement,
        {
            childList: true,
            subtree: true
        }
    );



    /*
     * Fallback para quitar el loader.
     *
     * Si Angular arrancó correctamente,
     * normalmente lo manejará por su cuenta.
     * Si no, evitamos dejar al usuario
     * viendo el spinner eternamente.
     */

    setTimeout(
        function () {


            const loader =
                document.getElementById(
                    "loading-bg"
                );


            if (loader) {

                loader.style.display =
                    "none";

            }


            montarResultado();


        },
        3500
    );



    /*
     * Después de 8 segundos dejamos
     * de observar modificaciones.
     */

    setTimeout(
        function () {


            montarResultado();


            observer.disconnect();


        },
        8000
    );


})();

</script>
